[versions]
# Platform
minecraft = '1.21.11'
java      = '21'

# Plugins
buildconfig = '6.0.6'
loom        = '1.15-SNAPSHOT'
neoforged   = '7.1.20'

# Development
manifold = '2026.1.4'

# Base Configuration
parchment = '2025.12.20'

[plugins]
buildconfig = { id = 'com.github.gmazzo.buildconfig',  version.ref = 'buildconfig' }
loom        = { id = 'net.fabricmc.fabric-loom-remap', version.ref = 'loom'        }
neoforged   = { id = 'net.neoforged.gradle.userdev',   version.ref = 'neoforged'   }

[libraries]
manifold-pp = { module = 'systems.manifold:manifold-preprocessor', version.ref = 'manifold'  }
minecraft   = { module = 'com.mojang:minecraft',                   version.ref = 'minecraft' }
parchment   = { module = 'org.parchmentmc.data:parchment-1.21.11', version.ref = 'parchment' }
