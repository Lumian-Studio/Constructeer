[versions]

# Base Configuration
fabric-loader = '0.18.4'
fabric-api    = '0.141.2+1.21.11'
modmenu       = '17.0.0-beta.2'
forgeconfig   = '21.11.1'
clothconfig   = '21.11.153'
devauth       = '1.2.2'

# Module Configurations
trinkets = '3.11.0-beta.2+1.21.11'
cca      = '7.3.0'
geckolib = '5.4.3'



[libraries]
fabric-loader = { module = 'net.fabricmc:fabric-loader',                                       version.ref = 'fabric-loader' }
fabric-api    = { module = 'net.fabricmc.fabric-api:fabric-api',                               version.ref = 'fabric-api'    }
modmenu       = { module = 'com.terraformersmc:modmenu',                                       version.ref = 'modmenu'       }
forgeconfig   = { module = 'fuzs.forgeconfigapiport:forgeconfigapiport-fabric',                version.ref = 'forgeconfig'   }
clothconfig   = { module = 'me.shedaniel.cloth:cloth-config-fabric',                           version.ref = 'clothconfig'   }
trinkets      = { module = 'eu.pb4.fork:trinkets',                                             version.ref = 'trinkets'      }
cca-base      = { module = 'org.ladysnake.cardinal-components-api:cardinal-components-base',   version.ref = 'cca'           }
cca-entity    = { module = 'org.ladysnake.cardinal-components-api:cardinal-components-entity', version.ref = 'cca'           }
geckolib      = { module = 'software.bernie.geckolib:geckolib-fabric-1.21.11',                 version.ref = 'geckolib'      }
devauth       = { module = 'me.djtheredstoner:DevAuth-fabric',                                 version.ref = 'devauth'       }



[bundles]
accessory = [ 'cca-base', 'cca-entity', 'trinkets' ]
