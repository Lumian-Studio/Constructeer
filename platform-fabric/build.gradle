plugins {
    id 'constructeer.fabric-conventions'
}

static def addFeature(proj, lib)
{
    proj.dependencies {
        implementation project(path: ":${lib.get().name}", configuration: 'namedElements')
    }
}

static def addClassTransformer(proj, String name)
{
    proj.loom.accessWidenerPath = proj.file("src/main/resources/${name}.classtweaker")
}

static def nestedJar(proj, lib)
{
    proj.dependencies {
        include lib
    }
}

subprojects {
    apply plugin: 'constructeer.fabric-conventions'
}

configurations {
    nestedJars {
        transitive = false
    }
}

dependencies {
    modImplementation platform.bundles.accessory

    modImplementation platform.geckolib
    include(platform.geckolib)

    features.bundles.constructeer.get().name.each { module ->
        api project(path: ":${module}", configuration: 'namedElements')
        nestedJars project(":${module}")
    }
}

loom.nestJars(tasks.named("jar"), configurations.nestedJars)
