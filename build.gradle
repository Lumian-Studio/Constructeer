plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'com.github.gmazzo.buildconfig' version "${buildconfig_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_package

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
        name = "Terraformers"
        url  = "https://maven.terraformersmc.com/"
    }

	maven {
        name = "Ladysnake Mods"
        url  = 'https://maven.ladysnake.org/releases'
    }

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}

		filter {
			includeGroup "maven.modrinth"
		}
	}

	maven { url "https://maven.shedaniel.me/" }

	maven {
        name = "Fuzs Mod Resources"
        url  = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }

	repositories {
		maven {
			name = 'ParchmentMC'
			url  = 'https://maven.parchmentmc.org'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"constructeer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
	}

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modImplementation "maven.modrinth:trinkets-canary:${project.trinkets_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

	modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"
}

processResources {
	inputs.property "version", project.version
    inputs.property "name",    project.mod_name

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
               "name":    inputs.properties.name
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.MD") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

buildConfig {
    className   "ModAutoDefine"
    packageName project.mod_package

    useJavaOutput()

    buildConfigField String.class, 'ID',         project.mod_id
    buildConfigField String.class, 'NAME',       project.mod_name
    buildConfigField String.class, 'VERSION',    project.mod_version
    buildConfigField String.class, 'MC_VERSION', project.minecraft_version
	buildConfigField String.class, 'PACKAGE',    project.mod_package
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}